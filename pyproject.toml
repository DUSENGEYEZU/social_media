[project]
name = "social-media"
version = "0.1.0"
description = "RESTful API for a social media application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "flasgger>=0.9.7.1",
    "flask>=3.1.3",
    "python-dotenv>=1.2.3",
    "sacremoses>=0.2.0",
    "sentencepiece>=0.2.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "yt-dlp[curl-cffi]>=2026.8.19",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# On Linux servers, pull the CPU-only PyTorch wheel instead of the multi-GB CUDA build.
# macOS wheels are CPU/Metal already, so the marker limits this to Linux.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
